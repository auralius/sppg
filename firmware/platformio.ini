; SPPG — Smart Photoplethysmography
; Classic ESP32 (ESP32-WROOM-32 / ESP32-D0WD-V3), 4 MB Flash, CH340 USB
; 1.9-inch ST7789 LCD, 170x320

[platformio]
default_envs = ir

[env]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.partitions = default.csv
board_build.f_cpu = 240000000L

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=170
    -DTFT_HEIGHT=320
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DTOUCH_CS=-1
    -DTFT_INVERSION_ON
    -DLOAD_GLCD
    -DLOAD_FONT2
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSERIAL_RAW=0
    -DNOODLE2_GRAPH_MAX_NODES=16
    -DPPG_RECORD_SECONDS=10
    -DPPG_LPF_CUTOFF_HZ=20.0f
    -DPPG_HPF_CUTOFF_HZ=0.50f
    -DPPG_NN_CONV_TILE=4

; Common final use cases:
;   ir      : IR channel with HPF + LPF (default, recommended)
;   red     : RED channel with HPF + LPF
;   ir-hpf  : IR channel with HPF only
;   red-hpf : RED channel with HPF only
;   ir-raw  : raw IR display
;   red-raw : raw RED display

[env:ir]
build_flags =
    ${env.build_flags}
    -DPLOT_IR=1
    -DPPG_HPF=1
    -DPPG_LPF=1

[env:red]
build_flags =
    ${env.build_flags}
    -DPLOT_RED=1
    -DPPG_HPF=1
    -DPPG_LPF=1

[env:ir-hpf]
build_flags =
    ${env.build_flags}
    -DPLOT_IR=1
    -DPPG_HPF=1
    -DPPG_LPF=0

[env:red-hpf]
build_flags =
    ${env.build_flags}
    -DPLOT_RED=1
    -DPPG_HPF=1
    -DPPG_LPF=0

[env:ir-raw]
build_flags =
    ${env.build_flags}
    -DPLOT_IR=1
    -DPPG_HPF=0
    -DPPG_LPF=0

[env:red-raw]
build_flags =
    ${env.build_flags}
    -DPLOT_RED=1
    -DPPG_HPF=0
    -DPPG_LPF=0
